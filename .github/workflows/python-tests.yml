name: Python CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run CLI smoke tests
        run: |
          cacheflow --help
          cacheflow validate --workflow vulntriage
          cacheflow benchmark --config benchmarks/workloads/synthetic.yaml --out benchmarks/results
          cacheflow analyze-db --schema demo --connection "sqlite:///:memory:" --out artifacts/db-demo

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary
          path: benchmarks/results/
