[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cacheflow"
version = "0.1.0"
description = "Deterministic agent execution runtime with AKV KV-cache management"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "CacheFlow Contributors"}]
keywords = ["dag", "agent", "akv", "kv-cache", "deterministic", "checkpoint"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License 2.0",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "requests>=2.28",
    "PyYAML>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
bench = []
gpu = []

[project.scripts]
cacheflow = "cacheflow.cli:main"

[tool.setuptools]
package-dir = {"" = "cacheflow/src"}
packages = [
    "cacheflow",
    "cacheflow.examples",
    "cacheflow.examples.vulntriage",
]
